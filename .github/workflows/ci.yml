name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.118+ requires Node >= 22; on 20 it refuses to start.
          node-version: 22
          cache: npm
      - name: Verify package-lock.json is in sync with package.json
        run: |
          if ! npm ci --dry-run >/dev/null 2>&1; then
            echo "::error::package-lock.json is out of sync with package.json."
            echo "::error::Fix locally with: npm install --package-lock-only --no-audit --no-fund"
            echo "::error::Then commit the updated package-lock.json."
            npm ci --dry-run
            exit 1
          fi
      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      - run: npm run test:integration
      - name: Wrangler dry-run deploy
        run: npx wrangler deploy --dry-run --outdir=.wrangler-out
        env:
          # Dummy values; dry-run does not authenticate or upload.
          CLOUDFLARE_API_TOKEN: ""

  # v4: deploy is MANUAL until the Phase 1a human-only steps (CLAUDE.md §9)
  # are done — resource ids in wrangler.jsonc, secrets, Entra registration. The
  # worker name is unchanged ("arcadia"), so an auto-deploy from main would
  # replace the live v2 worker before it is ready. Flip back to push-triggered
  # deploys once Phase 1a acceptance passes.
  deploy:
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.118+ requires Node >= 22; on 20 it refuses to start.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
