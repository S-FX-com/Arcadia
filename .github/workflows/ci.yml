name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.118+ requires Node >= 22; on 20 it refuses to start.
          node-version: 22
          cache: npm
      - name: Verify package-lock.json is in sync with package.json
        run: |
          if ! npm ci --dry-run >/dev/null 2>&1; then
            echo "::error::package-lock.json is out of sync with package.json."
            echo "::error::Fix locally with: npm install --package-lock-only --no-audit --no-fund"
            echo "::error::Then commit the updated package-lock.json."
            npm ci --dry-run
            exit 1
          fi
      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      - run: npm run test:integration
      - name: Wrangler dry-run deploy
        run: npx wrangler deploy --dry-run --outdir=.wrangler-out
        env:
          # Dummy values; dry-run does not authenticate or upload.
          CLOUDFLARE_API_TOKEN: ""

  # Deploy is manual (workflow_dispatch only). It runs only after the ci job
  # passes and only when no remote D1 migration is pending. Migrations are
  # applied by hand first; see migrations/README.md and the Human-only steps
  # section of CLAUDE.md.
  deploy:
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.118+ requires Node >= 22; on 20 it refuses to start.
          node-version: 22
          cache: npm
      - run: npm ci
      # This job does NOT apply migrations. Shane applies them by hand after
      # scripts/export-d1.sh. The script stops the deploy if any migration in
      # migrations/ is not yet applied to the remote database, so the old code
      # keeps running. See the script header for details.
      - name: Check for pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/check-pending-migrations.sh
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
