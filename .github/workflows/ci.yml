name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify package-lock.json is in sync with package.json
        run: |
          if ! npm ci --dry-run >/dev/null 2>&1; then
            echo "::error::package-lock.json is out of sync with package.json."
            echo "::error::Fix locally with: npm install --package-lock-only --no-audit --no-fund"
            echo "::error::Then commit the updated package-lock.json."
            npm ci --dry-run
            exit 1
          fi
      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      - run: npm run test:integration
      - name: Wrangler dry-run deploy
        run: npx wrangler deploy --dry-run --outdir=.wrangler-out
        env:
          # Dummy values; dry-run does not authenticate or upload.
          CLOUDFLARE_API_TOKEN: ""

  eval-gate:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compare latest run against rolling 10-run baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN unset — skipping eval gate."
            exit 0
          fi
          npx wrangler d1 execute arcadia-db --remote --json \
            --command "SELECT id, pass_rate, summary_json FROM eval_runs
                       WHERE pass_rate IS NOT NULL
                       ORDER BY started_at DESC LIMIT 11" \
            | npx tsx scripts/eval-gate.ts

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
